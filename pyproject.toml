[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrail"
version = "0.1.0"
description = "QTrial: RL-based noise-aware quantum circuit mapping for the Tianyan-287 (105-qubit) platform — CO-MAP reproduction + QTrail improvements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "numba>=0.61",
]

[project.optional-dependencies]
experiment = ["qiskit>=2.4,<3", "pytket>=1.30", "pytket-qiskit>=0.55", "mqt.bench>=2.2"]
platform = ["cqlib>=1.3"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
qtrail-pure = "qtrail.pure_cli:main"
qtrail-map = "qtrail.cli.map_cli:main"
qtrail-train = "qtrail.training.train_cli:main"
qtrail-eval = "qtrail.cli.eval_cli:main"
qtrail-web = "qtrail.web.app:main"

[tool.setuptools.packages.find]
include = ["qtrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
